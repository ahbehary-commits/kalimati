name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo only holds lib/ and pubspec.yaml, so we generate the Android
      # shell in a temporary folder (NOT on top of this project) and copy only
      # the android/ directory over. This avoids running `flutter create` inside
      # a folder that already has a Flutter pubspec.yaml.
      - name: Generate Android shell
        run: |
          flutter create --platforms=android --project-name kalimati --org com.example "$RUNNER_TEMP/shell"
          cp -r "$RUNNER_TEMP/shell/android" ./android

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kalimati-apk
          path: build/app/outputs/flutter-apk/app-release.apk
